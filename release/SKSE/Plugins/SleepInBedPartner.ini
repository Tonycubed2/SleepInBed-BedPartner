[BedPartner]
; Who may share the player's bed (Sleep In Bed SKSE: "Followers share the player's bed" must be on).
; 0 = any follower, 1 = opposite sex only, 2 = same sex only. Several qualify: one is picked at random.
iBedPartner=0
; Names (comma separated) of NPCs the game counts as your teammates but who are not your followers.
; Sleep In Bed ignores them: never sent to bed, never chosen for your bed. Example: sNotFollowers=Vilja
sNotFollowers=

[Camera]
; 1 = while you lie in bed, the camera stays in third person (switched back if anything puts it in first person).
bThirdPersonInBed=0

[Dress]
; 1 = after sleeping, your gear is put back on (Sleep In Bed's normal behavior). 0 = you stay as you are.
bRedressPlayer=1
; 1 = after sleeping, followers' gear is put back on (Sleep In Bed's normal behavior). 0 = they stay as they are.
bRedressFollowers=1

[Room]
; 1 = when you lie down indoors, other NPCs leave the room and a follower closes the door (and closes it again if it is opened while you are in bed).
bClearRoom=0

[Sleepwear]
; Sleepwear mode: equipment slots that stay on when the sleepwear is put on (comma separated slot numbers 30-61).
; Empty = everything that is not sleepwear comes off (Sleep In Bed's normal behavior). Example: sKeepSlots=35,36 keeps amulets and rings.
sKeepSlots=
